<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Aquarium Sign Up</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body, #root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      -webkit-app-region: no-drag;
    }
    body {
      font-family: "Lucida Console", "Courier New", monospace;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .auth-shell {
      width: 100%;
      height: 100%;
      padding: 8px;
    }
    .pixel-frame {
      height: 100%;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(8, 24, 40, 0.12) 0 2px,
          transparent 2px 4px
        ),
        linear-gradient(#2a6aa0, #12365c);
      border: 4px solid #0d2438;
      box-shadow:
        0 0 0 4px #7ec8f0,
        4px 4px 0 0 #071828,
        inset 0 0 0 4px rgba(180, 230, 255, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pixel-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #143250;
      color: #e6faff;
      padding: 8px 10px;
      border-bottom: 4px solid #0d2438;
      -webkit-app-region: drag;
      user-select: none;
    }
    .pixel-title {
      font-size: 11px;
      letter-spacing: 1px;
      -webkit-app-region: drag;
    }
    .pixel-x {
      -webkit-app-region: no-drag;
      width: 28px;
      height: 24px;
      border: 4px solid #0d2438;
      background: #c45c48;
      color: #fff8f0;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      box-shadow: inset 2px 2px 0 #f09880, 2px 2px 0 #071828;
    }
    .pixel-x:active {
      transform: translate(2px, 2px);
      box-shadow: inset 2px 2px 0 #f09880;
    }
    .pixel-banner {
      display: block;
      width: 100%;
      height: 112px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border-bottom: 4px solid #0d2438;
    }
    .pixel-body {
      flex: 1;
      padding: 14px 16px 16px;
      overflow: auto;
    }
    .pixel-heading {
      color: #e6faff;
      font-size: 22px;
      letter-spacing: 2px;
      text-shadow: 3px 3px 0 #071828;
    }
    .pixel-sub {
      color: #9ad0f0;
      font-size: 10px;
      margin: 6px 0 14px;
      letter-spacing: 1px;
    }
    .pixel-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .pixel-form label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: #c5e7ff;
      font-size: 10px;
      letter-spacing: 1px;
    }
    .pixel-form input {
      height: 36px;
      border: 4px solid #0d2438;
      background: #082038;
      color: #e6faff;
      font-family: inherit;
      font-size: 13px;
      padding: 0 8px;
      outline: none;
      box-shadow: inset 2px 2px 0 #041018, 2px 2px 0 #4aa0d0;
      image-rendering: pixelated;
    }
    .pixel-form input:focus {
      background: #0c3050;
      box-shadow: inset 2px 2px 0 #041018, 2px 2px 0 #c8ecff;
    }
    .pixel-btn {
      margin-top: 4px;
      height: 40px;
      border: 4px solid #0d2438;
      background: linear-gradient(#6ec8ff, #2f7cbe);
      color: #f4fbff;
      font-family: inherit;
      font-size: 14px;
      letter-spacing: 2px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: inset 2px 2px 0 #c8ecff, 4px 4px 0 #071828;
    }
    .pixel-btn:hover:not(:disabled) {
      background: linear-gradient(#8ad8ff, #3c90d8);
    }
    .pixel-btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: inset 2px 2px 0 #c8ecff, 2px 2px 0 #071828;
    }
    .pixel-btn:disabled {
      opacity: 0.65;
      cursor: wait;
    }
    .pixel-link {
      border: 0;
      background: transparent;
      color: #ffe08a;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 1px;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .pixel-error {
      border: 4px solid #6a2018;
      background: #401410;
      color: #ffc8b8;
      font-size: 11px;
      padding: 8px;
      box-shadow: 3px 3px 0 #071828;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="auth.js"></script>
</body>
</html>
